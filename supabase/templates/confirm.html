<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm your Zenvi account</title>
</head>
<body style="margin:0;padding:0;background-color:#0A0A0A;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
    Confirm this email to finish creating your Zenvi account.
  </div>
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0A0A0A;">
    <tr>
      <td align="center" style="padding:56px 24px;">
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:400px;">

          <tr>
            <td style="padding-bottom:40px;">
              <a href="{{ .SiteURL }}" style="text-decoration:none;color:#ffffff;font-size:16px;font-weight:600;letter-spacing:-0.4px;">
                Zenvi
              </a>
            </td>
          </tr>

          <tr>
            <td style="padding-bottom:10px;">
              <p style="margin:0;font-size:20px;font-weight:600;letter-spacing:-0.4px;line-height:1.3;color:#ffffff;">
                Confirm your email
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding-bottom:28px;">
              <p style="margin:0;font-size:14px;line-height:1.6;color:#8A8A8A;">
                Confirm this address to finish creating your Zenvi account.
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding-bottom:36px;">
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;background-color:#ffffff;color:#000000;text-decoration:none;font-size:14px;font-weight:500;line-height:1;padding:12px 16px;border-radius:8px;">
                Confirm email
              </a>
            </td>
          </tr>

          <tr>
            <td style="border-top:1px solid #1A1A1A;padding-top:20px;">
              <p style="margin:0;font-size:12px;line-height:1.6;color:#555555;">
                If you didn't create a Zenvi account, you can ignore this. This link expires in 1 hour.
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding-top:32px;">
              <a href="{{ .SiteURL }}" style="color:#3A3A3A;text-decoration:none;font-size:12px;">zenvi.pro</a>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
